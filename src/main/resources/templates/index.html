<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar('dashboard')"></div>

<div class="content">

    <h1 class="text-primary mb-4">🏭 Factory Dashboard</h1>

    <div class="row">

        <!-- PRODUCTS -->
        <div class="col-md-3 mb-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>📦 Products</h5>
                    <h2 th:text="${productCount}">0</h2>
                </div>
            </div>
        </div>

        <!-- ORDERS -->
        <div class="col-md-3 mb-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>📋 Orders</h5>
                    <h2 th:text="${orderCount}">0</h2>
                </div>
            </div>
        </div>

        <!-- MACHINES -->
        <div class="col-md-3 mb-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>⚙️ Machines</h5>
                    <h2 th:text="${machineCount}">0</h2>
                </div>
            </div>
        </div>

        <!--  QUALITY -->
        <div class="col-md-3 mb-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>🔍 Inspections</h5>
                    <h2 th:text="${qualityCount}">0</h2>
                </div>
            </div>
        </div>

        <!-- MAINTENANCE -->
        <div class="col-md-3 mb-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>🔧 Maintenance</h5>
                    <h2 th:text="${maintenanceCount}">0</h2>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
