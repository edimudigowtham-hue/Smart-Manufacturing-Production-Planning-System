<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Production Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/sidebar :: sidebar('orders')"></div>
<div class="content">

    <h1 class="mb-4 text-primary">🏭 Production Order Management</h1>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            Create Production Order
        </div>
        <div class="card-body">

            <form th:action="@{/orders/createProductionOrder}" method="post">

                <div class="mb-3">
                    <label class="form-label">Product ID</label>
                    <input type="number" name="productId" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Planned Quantity</label>
                    <input type="number" name="plannedQuantity" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Produced Quantity</label>
                    <input type="number" name="producedQuantity" value="0" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="startDate" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="endDate" class="form-control">
                </div>

                <input type="hidden" name="orderStatus" value="PLANNED">

                <button type="submit" class="btn btn-success">Create Order</button>
            </form>

        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-warning text-dark">
            Release Order
        </div>
        <div class="card-body">

            <form th:action="@{/orders/release}" method="post">
                <div class="mb-3">
                    <label class="form-label">Order ID</label>
                    <input type="number" name="orderId" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-warning">Release</button>
            </form>

        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-info text-white">
            Check Order Progress
        </div>
        <div class="card-body">

            <form th:action="@{/orders/progress}" method="get">
                <div class="mb-3">
                    <label class="form-label">Order ID</label>
                    <input type="number" name="orderId" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-info text-white">Check Progress</button>
            </form>

        </div>
    </div>

    <div class="card mb-5">
        <div class="card-header bg-dark text-white">
            Order List
        </div>
        <div class="card-body">

            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Product ID</th>
                    <th>Planned</th>
                    <th>Produced</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.orderId}"></td>
                    <td th:text="${o.productId}"></td>
                    <td th:text="${o.plannedQuantity}"></td>
                    <td th:text="${o.producedQuantity}"></td>
                    <td th:text="${o.startDate}"></td>
                    <td th:text="${o.endDate}"></td>
                    <td>
                        <span class="badge bg-success" th:text="${o.orderStatus}"></span>
                        <a th:href="@{/orders/edit/{id}(id=${o.orderId})}" class="btn btn-sm btn-warning">Update</a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
