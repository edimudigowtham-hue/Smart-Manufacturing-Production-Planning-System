<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div th:replace="fragments/sidebar :: sidebar('edit-product')"></div>
<div class="content">

    <h2 class="mb-4">✏️ Edit Product</h2>

    <form th:action="@{/products/update}" method="post" class="card p-4 shadow-sm mb-3">

        <input type="hidden" name="productId" th:value="${product.productId}">

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input class="form-control" type="text" name="productName" th:value="${product.productName}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Product Code</label>
            <input class="form-control" type="text" name="productCode" th:value="${product.productCode}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">BOM Version</label>
            <input class="form-control" type="text" name="bomVersion" th:value="${product.bomVersion}">
        </div>

        <div class="mb-3">
            <label class="form-label">Standard Cost</label>
            <input class="form-control" type="number" step="0.01" name="standardCost" th:value="${product.standardCost}">
        </div>

        <select class="form-control mb-2" name="productStatus">
            <option value="ACTIVE" th:selected="${product.productStatus == 'ACTIVE'}">ACTIVE</option>
            <option value="INACTIVE" th:selected="${product.productStatus == 'INACTIVE'}">INACTIVE</option>
            <option value="PHASED_OUT" th:selected="${product.productStatus == 'PHASED_OUT'}">PHASED_OUT</option>
        </select>
        <div>
            <button type="submit" class="btn btn-primary">Update Product</button>
            <a class="btn btn-secondary" th:href="@{/products-page}">Cancel</a>
        </div>
    </form>

</div>

</body>
</html>
