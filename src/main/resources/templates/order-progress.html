<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Progress</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/sidebar :: sidebar('order-progress')"></div>
<div class="content">

    <h1 class="text-primary">📊 Order Progress</h1>

    <div class="card mt-3 mb-4">
        <div class="card-body">
            <h5 class="card-title mb-0" th:text="${progressResult}">Loading progress...</h5>
        </div>
    </div>

    <a th:href="@{/orders-page}" class="btn btn-secondary">← Back to Orders</a>

</div>

</body>
</html>
