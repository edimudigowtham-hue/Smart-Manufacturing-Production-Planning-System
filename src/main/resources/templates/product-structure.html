<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar('product-structure')"></div>
<div class="content">

    <h2 class="mb-4">📦 Product Details</h2>

    <ul class="list-group mb-4">
        <li class="list-group-item"><strong>ID:</strong> <span th:text="${product.productId}"></span></li>
        <li class="list-group-item"><strong>Name:</strong> <span th:text="${product.productName}"></span></li>
        <li class="list-group-item"><strong>Code:</strong> <span th:text="${product.productCode}"></span></li>
        <li class="list-group-item"><strong>BOM Version:</strong> <span th:text="${product.bomVersion}"></span></li>
        <li class="list-group-item"><strong>Standard Cost:</strong> $<span th:text="${product.standardCost}"></span></li>
    </ul>

    <a class="btn btn-secondary" th:href="@{/products-page}">Back to Products</a>

</div>

</body>
</html>
