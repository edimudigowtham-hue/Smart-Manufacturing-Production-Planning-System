<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar('products')"></div>

<div class="content">

    <h2 class="text-primary mb-3">📦 Product Management</h2>

    <form th:action="@{/products/createProduct}" method="post" class="card p-3 mb-4">
        <input class="form-control mb-2" type="text" name="productName" placeholder="Product Name" required>
        <input class="form-control mb-2" type="text" name="productCode" placeholder="Product Code" required>
        <input class="form-control mb-2" type="text" name="bomVersion" placeholder="BOM Version" required>
        <input class="form-control mb-2" type="number" step="0.01" name="standardCost" placeholder="Cost" required>

        <select class="form-select mb-2" name="productStatus" required>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
            <option value="PHASED_OUT">PHASED_OUT</option>
        </select>

        <button type="submit" class="btn btn-success">Add Product</button>
    </form>

    <form th:action="@{/products/updateBom}" method="post" class="card p-3 mb-4">
        <input class="form-control mb-2" type="number" name="productId" placeholder="Product ID" required>
        <input class="form-control mb-2" type="text" name="bomVersion" placeholder="New BOM" required>

        <button type="submit" class="btn btn-warning">Update BOM</button>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Code</th>
            <th>BOM</th>
            <th>Cost</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.productId}"></td>
            <td th:text="${p.productName}"></td>
            <td th:text="${p.productCode}"></td>
            <td th:text="${p.bomVersion}"></td>
            <td th:text="${p.standardCost}"></td>
            <td th:text="${p.productStatus}"></td>

            <td>
                <a class="btn btn-info btn-sm me-1" th:href="@{/products/structure/{id}(id=${p.productId})}">Structure</a>
                <a class="btn btn-warning btn-sm me-1" th:href="@{/products/edit/{id}(id=${p.productId})}">Edit</a>
                <a class="btn btn-danger btn-sm me-1" th:href="@{/products/delete/{id}(id=${p.productId})}">Delete</a>
                <a class="btn btn-primary btn-sm" th:href="@{/products/addComponent/{id}(id=${p.productId})}">Add Component</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
